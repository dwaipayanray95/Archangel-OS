# Copy to config.yaml (in this dir for local dev, or /etc/archangel/config.yaml
# on the server) and fill in real values. config.yaml itself should never be
# committed - see .gitignore.

# MUST be the WireGuard interface IP once WireGuard is set up (e.g.
# "10.10.0.1"). For local dev before WireGuard exists, 127.0.0.1 is fine -
# never use 0.0.0.0 or a public IP.
bind_addr: "127.0.0.1"
port: 8443

# Legacy single shared-token hash. Optional - new devices should be paired
# with `archangeld pair <name>` instead (see below), which manages its own
# per-device tokens in token_store_path and never touches this field.
token_hash: ""

# Where per-device token hashes live, one entry per device paired via
# `archangeld pair`. Defaults to /etc/archangel/tokens.json if unset.
token_store_path: ""

# WireGuard settings `archangeld pair` needs to add new peers. Defaults
# shown - only override if infra/scripts/wireguard_setup.sh's WG_DIR/
# WG_SUBNET or the interface name were changed from their defaults.
wg_dir: ""          # default: /etc/wireguard
wg_interface: ""    # default: wg0
wg_subnet: ""        # default: 10.10.0

# This server's public "host:port" for WireGuard (e.g. "203.0.113.5:51820")
# - required for `archangeld pair` so it can tell a new device where to
# dial in from outside the tunnel. Not needed just to run the server.
public_endpoint: ""

# Directory the Files tab is jailed to (both textually and after
# resolving symlinks - a symlink inside this directory that points
# outside it is treated as inaccessible). Required for the Files tab to
# work at all: left empty, every /api/v1/files/* request is rejected
# rather than defaulting to allowing the whole filesystem. e.g. "/home/ubuntu".
files_root: ""

# Largest single file the Files tab may upload, in bytes. 0 or unset means
# the default: 2147483648 (2 GiB).
upload_max_bytes: 0

# Unix socket of the tmux server that hosts the Terminal tab's persistent
# shells. The tmux server runs under the archangel user's systemd user
# manager (outside archangel.service's sandbox, memory cap and restarts),
# and the socket path has to be explicit because the service has
# PrivateTmp=true - a default /tmp socket would be invisible to it. The
# parent directory is created with mode 0700.
# Default: /home/archangel/.archangel/tmux.sock
terminal_socket: ""
