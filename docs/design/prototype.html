<title>Archangel OS Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: a prototype control bar, then one scaled device frame (phone / tablet / Mac).
   Inside: Pearl Halo (light) and Dawn Halo (dark) — one frosted-glass system, two themes. */
:root{
  --page:#E4E6F0; --page-fg:#141726; --page-muted:#4A5068; --bar:rgba(255,255,255,.78); --bar-b:rgba(20,23,38,.08);
  --wall:radial-gradient(60% 55% at 0% 0%, #D9D2FF 0%, rgba(217,210,255,0) 100%), radial-gradient(60% 60% at 100% 100%, #C6F0E8 0%, rgba(198,240,232,0) 100%), radial-gradient(40% 40% at 75% 15%, rgba(255,214,232,.65) 0%, rgba(255,214,232,0) 100%), #F2F3F9;
  --bg:#F2F3F9;
  --glass:rgba(255,255,255,.62); --glass-2:rgba(255,255,255,.86); --glass-b:rgba(255,255,255,.95); --sunk:rgba(20,23,38,.045);
  --line:rgba(20,23,38,.09); --line-2:rgba(20,23,38,.17);
  --text:#141726; --muted:#4A5068; --subtle:#565C78;
  --accent:#4B3FD1; --accent-2:#0E7F75; --on-accent:#FFFFFF; --accent-wash:#E8E6FF;
  --ok:#137A4A; --ok-wash:#E3F5EC; --warn:#8A5A00; --warn-wash:#FFF1D6; --bad:#B3261E; --bad-wash:#FDE7E5; --info:#2457C5; --info-wash:#E4ECFF;
  --card-shadow:0 8px 24px rgba(60,50,140,.08); --shadow:0 14px 40px rgba(60,50,140,.16); --shadow-win:0 24px 70px rgba(50,40,120,.24);
  --term-bg:#161829; --term-fg:#E6E8F5; --term-dim:#A9AEC9; --term-acc:#8FE3D6; --term-acc2:#C3B8FF;
  --boot-bg:#F4F5FA; --orb1:#7D6BFF; --orb2:#3CCFC0; --orb3:#FF9BC8;
  --scrim:rgba(20,23,38,.28); --bezel:#14161F;
  --f-ui:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#04050A; --page-fg:#F4F5FB; --page-muted:#B9BDD6; --bar:rgba(16,18,34,.82); --bar-b:rgba(255,255,255,.08);
    --wall:radial-gradient(60% 60% at 0% 0%, #4E3FD0 0%, rgba(78,63,208,0) 100%), radial-gradient(60% 60% at 100% 100%, #0B8F8F 0%, rgba(11,143,143,0) 100%), radial-gradient(40% 40% at 65% 35%, rgba(150,110,255,.22) 0%, rgba(150,110,255,0) 100%), #0B0D1A;
    --bg:#0B0D1A; --glass:rgba(255,255,255,.075); --glass-2:rgba(22,24,44,.88); --glass-b:rgba(255,255,255,.14); --sunk:rgba(255,255,255,.055);
    --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.2);
    --text:#F4F5FB; --muted:#C2C6DC; --subtle:#B0B5CF;
    --accent:#8FE3D6; --accent-2:#B7A9FF; --on-accent:#0B0D1A; --accent-wash:rgba(143,227,214,.15);
    --ok:#6EE7A8; --ok-wash:rgba(110,231,168,.13); --warn:#FFC56B; --warn-wash:rgba(255,197,107,.14); --bad:#FF9A8F; --bad-wash:rgba(255,143,132,.14); --info:#A8C0FF; --info-wash:rgba(157,184,255,.14);
    --card-shadow:none; --shadow:0 14px 40px rgba(0,0,0,.4); --shadow-win:0 30px 80px rgba(0,0,0,.55);
    --term-bg:rgba(6,8,18,.9);
    --boot-bg:#06070E; --orb1:#6B55FF; --orb2:#19B8B0; --orb3:#C26BFF;
    --scrim:rgba(0,0,0,.5); --bezel:#000000;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#04050A; --page-fg:#F4F5FB; --page-muted:#B9BDD6; --bar:rgba(16,18,34,.82); --bar-b:rgba(255,255,255,.08);
  --wall:radial-gradient(60% 60% at 0% 0%, #4E3FD0 0%, rgba(78,63,208,0) 100%), radial-gradient(60% 60% at 100% 100%, #0B8F8F 0%, rgba(11,143,143,0) 100%), radial-gradient(40% 40% at 65% 35%, rgba(150,110,255,.22) 0%, rgba(150,110,255,0) 100%), #0B0D1A;
  --bg:#0B0D1A; --glass:rgba(255,255,255,.075); --glass-2:rgba(22,24,44,.88); --glass-b:rgba(255,255,255,.14); --sunk:rgba(255,255,255,.055);
  --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.2);
  --text:#F4F5FB; --muted:#C2C6DC; --subtle:#B0B5CF;
  --accent:#8FE3D6; --accent-2:#B7A9FF; --on-accent:#0B0D1A; --accent-wash:rgba(143,227,214,.15);
  --ok:#6EE7A8; --ok-wash:rgba(110,231,168,.13); --warn:#FFC56B; --warn-wash:rgba(255,197,107,.14); --bad:#FF9A8F; --bad-wash:rgba(255,143,132,.14); --info:#A8C0FF; --info-wash:rgba(157,184,255,.14);
  --card-shadow:none; --shadow:0 14px 40px rgba(0,0,0,.4); --shadow-win:0 30px 80px rgba(0,0,0,.55);
  --term-bg:rgba(6,8,18,.9);
  --boot-bg:#06070E; --orb1:#6B55FF; --orb2:#19B8B0; --orb3:#C26BFF;
  --scrim:rgba(0,0,0,.5); --bezel:#000000;
  color-scheme:dark;
}

html,body{height:100%}
body{background:var(--page);color:var(--page-fg);font-family:var(--f-ui);font-size:14px;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ic{flex:none;display:block}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ───── prototype control bar ───── */
.pbar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));background:var(--bar);border-bottom:1px solid var(--bar-b);backdrop-filter:blur(20px);z-index:5}
.pbar .ttl{display:flex;flex-direction:column;gap:1px;margin-right:auto;min-width:0}
.pbar .ttl b{font-size:13px;font-weight:600}
.pbar .ttl span{font-size:11.5px;color:var(--page-muted)}
.pgroup{display:flex;align-items:center;gap:6px}
.pgroup>.lbl{font-size:11px;color:var(--page-muted);letter-spacing:.04em;text-transform:uppercase}
.pseg{display:inline-flex;padding:2px;border-radius:9px;background:var(--sunk);border:1px solid var(--line);gap:2px}
.pseg button{height:28px;padding:0 10px;border:0;border-radius:7px;background:transparent;color:var(--page-muted);font:500 12px var(--f-ui);cursor:pointer}
.pseg button[aria-pressed="true"]{background:var(--glass-2);color:var(--page-fg);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.pseg button:disabled{opacity:.4;cursor:not-allowed}
.pbtn{height:32px;padding:0 12px;border-radius:9px;border:1px solid var(--line-2);background:transparent;color:var(--page-fg);font:500 12px var(--f-ui);cursor:pointer;display:inline-flex;align-items:center;gap:6px}

.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.dwrap{position:relative;flex:none}

/* ───── device frames ───── */
.device{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:var(--wall);background-color:var(--bg);color:var(--text);font-family:var(--f-ui);font-size:14px;line-height:1.4}
.device.phone{border-radius:50px;box-shadow:0 0 0 11px var(--bezel),0 0 0 12px rgba(127,127,140,.35),0 40px 90px rgba(0,0,0,.35)}
.device.tablet{border-radius:30px;box-shadow:0 0 0 13px var(--bezel),0 0 0 14px rgba(127,127,140,.35),0 40px 90px rgba(0,0,0,.35)}
.device.mac{border-radius:14px;box-shadow:0 0 0 1px var(--line-2),0 40px 90px rgba(0,0,0,.35)}

/* ───── shared components ───── */
.glass,.card{background:var(--glass);border:1px solid var(--glass-b);border-radius:20px;backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%);box-shadow:var(--card-shadow)}
.card{min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 6px}
.h1{margin:0;font-size:26px;line-height:1.2;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.h2{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em}
.h3{margin:0;font-size:14px;font-weight:600}
.eyebrow{font-size:12.5px;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.p{margin:0;line-height:1.5;color:var(--muted);max-width:62ch}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);background:var(--glass-2);color:var(--text);font:600 13px var(--f-ui);cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.danger.solid{background:var(--bad);color:#fff}
.btn.sm{height:32px;padding:0 12px;font-size:12.5px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ibtn{width:36px;height:36px;border-radius:10px;border:0;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.ibtn:hover{background:var(--sunk);color:var(--text)}

.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font:600 12px var(--f-ui);white-space:nowrap;flex:none}
.chip.ok{background:var(--ok-wash);color:var(--ok)}
.chip.warn{background:var(--warn-wash);color:var(--warn)}
.chip.bad{background:var(--bad-wash);color:var(--bad)}
.chip.info{background:var(--info-wash);color:var(--info)}
.chip.off{background:var(--sunk);color:var(--muted)}
.chip.acc{background:var(--accent-wash);color:var(--accent)}

.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);gap:2px;max-width:100%;overflow-x:auto}
.seg button{height:32px;padding:0 14px;border-radius:999px;border:0;background:transparent;color:var(--muted);font:500 13px var(--f-ui);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--glass-2);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.14)}

.switch{width:46px;height:28px;border-radius:999px;border:1px solid var(--line-2);background:var(--sunk);position:relative;cursor:pointer;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:left .2s,background .2s}
.switch[aria-checked="true"]{background:var(--accent);border-color:transparent}
.switch[aria-checked="true"]::after{left:21px;background:var(--on-accent)}
.switch:disabled{opacity:.45;cursor:not-allowed}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:500}
.field .hint{font-size:12px;color:var(--muted)}
.input{height:44px;border-radius:12px;border:1px solid var(--line-2);background:var(--glass-2);color:var(--text);padding:0 14px;font:400 14px var(--f-ui);width:100%;box-sizing:border-box}
.input.mono{font-family:var(--f-mono)}
.input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.li .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:12.5px;color:var(--muted)}
.li.click{cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%;font:inherit;color:inherit}
.li.click:hover{background:var(--sunk)}
.li.sel{background:var(--accent-wash)}
.tile{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;font:700 15px var(--f-ui);background:var(--accent-wash);color:var(--accent)}
.tile.t2{background:var(--info-wash);color:var(--info)}
.tile.t3{background:var(--ok-wash);color:var(--ok)}
.tile.t4{background:var(--warn-wash);color:var(--warn)}
.tile.t5{background:var(--sunk);color:var(--text)}

.wm{display:inline-flex;align-items:baseline;gap:.26em;font:600 17px/1 var(--f-ui);letter-spacing:-.02em;white-space:nowrap;color:var(--text)}
.wm span{font-weight:400;color:var(--accent);letter-spacing:0}

/* connection strip */
.conn{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 14px;border-radius:12px;font-size:13px;font-weight:600;transition:background .3s,color .3s}
.conn .s{font-weight:400;color:var(--muted)}
.conn.ok{background:var(--ok-wash);color:var(--ok)}
.conn.busy{background:var(--info-wash);color:var(--info)}
.conn.warn{background:var(--warn-wash);color:var(--warn)}
.conn .stages{margin-left:auto;display:flex;gap:4px}
.conn .stages i{width:14px;height:4px;border-radius:4px;background:currentColor;opacity:.25}
.conn .stages i.on{opacity:1}
.conn.compact{min-height:28px;padding:0 10px;font-size:12px;border-radius:999px}

/* screens */
.scr{container-type:inline-size;display:flex;flex-direction:column;gap:16px;min-width:0}
.scr-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.scr-head .h1{font-size:24px}
.hero{padding:20px;display:flex;flex-direction:column;gap:8px}
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.metric{padding:14px;display:flex;flex-direction:column;gap:7px}
.metric .k{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.metric .v{font:500 24px/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.metric .v small{font-size:13px;color:var(--muted);font-weight:400}
.metric .note{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.metric .note.warn{color:var(--warn)}
.bar{height:5px;border-radius:5px;background:var(--line)}
.bar>i{display:block;height:100%;border-radius:5px;background:var(--accent);transition:width .6s}
.bar.warn>i{background:var(--warn)}
.home-cols{display:grid;gap:16px}
.qa{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:6px 12px 14px}
.qa button{display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 12px;border-radius:14px;border:1px solid var(--line);background:var(--glass-2);font:500 13px var(--f-ui);cursor:pointer;text-align:left}
.qa button:hover{border-color:var(--accent)}
.qa .ic{color:var(--accent)}
.empty{display:flex;align-items:center;gap:10px;padding:14px 16px;color:var(--ok);font-weight:500}
@container (min-width: 620px){ .metrics{grid-template-columns:repeat(4,minmax(0,1fr))} }
@container (min-width: 780px){ .home-cols{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)} .hero .h1{font-size:30px} }

.app-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.app-row:first-child{border-top:0}
.app-row .nm{display:flex;flex-direction:column;gap:2px;min-width:0}
.app-row .nm b{font-weight:600}
.app-row .nm span{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app-row .meta{grid-column:2 / -1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.app-row .acts{grid-column:2 / -1;display:flex;gap:6px;flex-wrap:wrap}
@container (min-width: 680px){
  .app-row{grid-template-columns:auto minmax(0,1fr) auto auto}
  .app-row .meta{grid-column:auto}
  .app-row .acts{grid-column:auto}
}

.crumbs{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:13px}
.crumbs button{border:0;background:none;padding:4px 6px;border-radius:8px;cursor:pointer;color:var(--muted);font:500 13px var(--f-ui)}
.crumbs button:last-child{color:var(--text);font-weight:600}
.files{display:grid;gap:16px;align-items:start}
@container (min-width: 700px){ .files.has-preview{grid-template-columns:minmax(0,1fr) 300px} }
.preview{padding:16px;display:flex;flex-direction:column;gap:12px}
.pv-img{aspect-ratio:4/3;max-width:100%;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:var(--muted);font-size:12px;background:linear-gradient(135deg,var(--accent-wash),var(--ok-wash))}
.pv-text{margin:0;padding:12px;border-radius:12px;background:var(--term-bg);color:var(--term-fg);font:12px/1.6 var(--f-mono);white-space:pre-wrap;max-height:240px;overflow:auto}

.ttabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.ttab{height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--glass);font:500 12.5px var(--f-mono);color:var(--muted);display:inline-flex;align-items:center;gap:8px;cursor:pointer;flex:none}
.ttab[aria-selected="true"]{background:var(--accent-wash);color:var(--accent);border-color:transparent}
.term-box{display:flex;flex-direction:column;border-radius:16px;overflow:hidden;background:var(--term-bg);border:1px solid var(--line);flex:1;min-height:0}
.term{flex:1;min-height:200px;overflow:auto;padding:14px 16px;color:var(--term-fg);font:13px/1.65 var(--f-mono);white-space:pre-wrap;word-break:break-word}
.term .pr{color:var(--term-acc)}
.term .pa{color:var(--term-acc2)}
.term .dm{color:var(--term-dim)}
.term .ok{color:#7CF2B4}
.term .wr{color:#FFC66E}
.term-in{display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid rgba(255,255,255,.08);font:13px var(--f-mono);color:var(--term-acc)}
.term-in input{flex:1;min-width:0;border:0;background:transparent;color:var(--term-fg);font:13px var(--f-mono);outline:none;caret-color:var(--term-acc)}
.keybar{display:flex;gap:6px;overflow-x:auto;padding:2px 0}
.key{min-width:46px;height:40px;padding:0 10px;border-radius:10px;border:1px solid var(--line-2);background:var(--glass-2);font:500 13px var(--f-mono);color:var(--text);cursor:pointer;flex:none}
.key[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:transparent}

.charts{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@container (min-width: 560px){ .charts{grid-template-columns:repeat(2,minmax(0,1fr))} }
.chart{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.chart .top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.chart .v{font:500 22px var(--f-mono)}
.chart svg{width:100%;height:84px;display:block}
.chart .axis{display:flex;justify-content:space-between;font:11px var(--f-mono);color:var(--muted)}
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:500;color:var(--muted);padding:10px 16px;font-size:12px;white-space:nowrap}
.tbl th button{border:0;background:none;color:inherit;font:inherit;cursor:pointer;padding:0;display:inline-flex;gap:4px;align-items:center}
.tbl td{padding:10px 16px;border-top:1px solid var(--line);white-space:nowrap}
.tbl td.num,.tbl th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.set{display:grid;gap:16px;align-items:start}
@container (min-width: 720px){ .set{grid-template-columns:220px minmax(0,1fr)} }
.set-nav{padding:6px}
.set-nav button{display:flex;align-items:center;gap:10px;width:100%;height:42px;padding:0 12px;border-radius:12px;border:0;background:none;font:500 13.5px var(--f-ui);cursor:pointer;text-align:left;color:var(--text)}
.set-nav button:hover{background:var(--sunk)}
.set-nav button[aria-current="true"]{background:var(--accent-wash);color:var(--accent);font-weight:600}
.set-nav button.dz{color:var(--bad)}
.set-sec{display:flex;flex-direction:column;gap:14px}
.qrbox{width:188px;height:188px;padding:14px;box-sizing:border-box;border-radius:18px;background:#fff;border:1px solid var(--line);display:grid;grid-template-columns:repeat(11,1fr);gap:2px;margin:0 auto}
.qrbox i{border-radius:1.5px}
.qrbox i.on{background:#141726}


/* ───── pro console (terminal) ───── */
.con{--cb:#0D0F1D;--cb2:#141729;--cb3:#1C2036;--cl:rgba(255,255,255,.08);--ct:#E6E8F5;--cm:#9CA2C2;--ca:#8FE3D6;--ca2:#C3B8FF;
  flex:1;min-height:0;display:flex;flex-direction:column;border-radius:18px;overflow:hidden;background:var(--cb);border:1px solid var(--cl);color:var(--ct);font-family:var(--f-mono);box-shadow:0 18px 50px rgba(5,6,20,.25)}
.con-bar{display:flex;align-items:center;gap:4px;padding:6px 6px 6px 8px;background:var(--cb2);border-bottom:1px solid var(--cl);min-width:0}
.con-tabs{display:flex;gap:2px;overflow-x:auto;min-width:0;flex:1;scrollbar-width:none}
.ctab{display:inline-flex;align-items:center;height:34px;border-radius:9px;flex:none}
.ctab[aria-selected="true"]{background:var(--cb3)}
.ctab-main{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 4px 0 12px;border:0;background:none;color:var(--cm);font:500 12.5px var(--f-mono);cursor:pointer}
.ctab[aria-selected="true"] .ctab-main{color:var(--ct)}
.ctab .live{width:7px;height:7px;border-radius:50%;background:#6EE7A8;box-shadow:0 0 0 3px rgba(110,231,168,.15)}
.ctab .x{width:24px;height:24px;margin-right:4px;border-radius:6px;border:0;background:none;color:var(--cm);display:grid;place-items:center;cursor:pointer}
.ctab .x:hover,.cbtn:hover{background:rgba(255,255,255,.08);color:var(--ct)}
.cbtn{width:34px;height:34px;border-radius:8px;border:0;background:transparent;color:var(--cm);display:grid;place-items:center;cursor:pointer;flex:none;font:600 12px var(--f-ui)}
.cbtn[aria-pressed="true"]{background:var(--cb3);color:var(--ca)}
.con-sep{width:1px;height:20px;background:var(--cl);margin:0 4px;flex:none}
.con-srv{font:500 12px var(--f-mono);color:var(--cm);padding:0 6px;white-space:nowrap}
.con-chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font:600 11.5px var(--f-ui);white-space:nowrap;flex:none}
.con-chip.on{background:rgba(255,197,107,.14);color:#FFC66E}
.con-chip.off{background:rgba(255,255,255,.06);color:var(--cm)}
.con-main{flex:1;min-height:0;display:flex}
.con-col{flex:1;min-width:0;display:flex;flex-direction:column}
.con-out{flex:1;min-height:120px;overflow:auto;padding:16px 18px 6px;font-size:var(--tfs,13px);line-height:1.7;white-space:pre-wrap;word-break:break-word}
.con-out .pr,.con-in .pr{color:var(--ca)}
.con-out .pa,.con-in .pa{color:var(--ca2)}
.con-out .dm,.con-in .dm{color:var(--cm)}
.con-out .ok{color:#7CF2B4}
.con-out .wr{color:#FFC66E}
.con-in{display:flex;align-items:center;gap:8px;padding:6px 18px 14px;font-size:var(--tfs,13px)}
.con-in input{flex:1;min-width:0;border:0;background:transparent;color:var(--ct);font:inherit;outline:none;caret-color:var(--ca)}
.con-in kbd{font:500 11px var(--f-mono);color:var(--cm);border:1px solid var(--cl);border-radius:6px;padding:2px 6px}
.con-foot{display:flex;align-items:center;gap:10px;padding:6px 14px;background:var(--cb2);border-top:1px solid var(--cl);font:11.5px var(--f-mono);color:var(--cm);white-space:nowrap;overflow:hidden}
.con-foot .ok{color:#7CF2B4;display:inline-flex;align-items:center;gap:5px}
.con-foot .sp{flex:1}
.snips{width:270px;flex:none;border-left:1px solid var(--cl);background:#10132A;display:flex;flex-direction:column;min-height:0}
.snips h3{margin:0;padding:14px 14px 4px;font:600 13px var(--f-ui);color:var(--ct)}
.snips p{margin:0;padding:0 14px 10px;font:12px var(--f-ui);color:var(--cm)}
.snips .list{overflow:auto;padding:0 8px 10px}
.snip{display:flex;flex-direction:column;gap:3px;width:100%;text-align:left;padding:10px;border-radius:10px;border:0;background:none;cursor:pointer}
.snip:hover{background:var(--cb3)}
.snip b{font:500 13px var(--f-ui);color:var(--ct)}
.snip code{font:12px var(--f-mono);color:var(--ca)}
.ckeys{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:var(--cb2);border-top:1px solid var(--cl)}
.ckey{min-width:44px;height:40px;padding:0 10px;border-radius:9px;border:1px solid rgba(255,255,255,.12);background:var(--cb3);color:var(--ct);font:500 13px var(--f-mono);cursor:pointer;flex:none}
.ckey[aria-pressed="true"]{background:var(--ca);color:#0B0D1A;border-color:transparent}
.ckey.alt{color:var(--ca);font-family:var(--f-ui);font-weight:600}
.win-body.flush{padding:0}
.win-body.flush .con{border-radius:0;border:0;box-shadow:none}
.sheet-snips .snip b{color:var(--text)}
.sheet-snips .snip code{color:var(--accent)}
.sheet-snips .snip:hover{background:var(--sunk)}

/* ───── phone shell ───── */
.ph{position:absolute;inset:0;display:flex;flex-direction:column}
.ph-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:56px 18px 8px;min-height:44px}
.ph-head .ttl{font-size:17px;font-weight:600;display:flex;align-items:center;gap:6px}
.ph-strip{flex:none;padding:0 16px 6px}
.ph-body{flex:1;overflow:auto;padding:10px 16px 112px;display:flex;flex-direction:column}
.ph-body.term-mode{padding-bottom:96px}
.tabbar{position:absolute;left:12px;right:12px;bottom:18px;height:68px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-radius:24px;background:var(--glass-2);border:1px solid var(--glass-b);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);box-shadow:var(--shadow);z-index:20}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:500 11px var(--f-ui);color:var(--muted);background:none;border:0;cursor:pointer;border-radius:20px}
.tab[aria-current="page"]{color:var(--accent);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;background:var(--glass-2);border:1px solid var(--line);font:500 12.5px var(--f-mono);cursor:pointer;color:var(--text);max-width:60%;overflow:hidden}

/* ───── wide (simple) shell ───── */
.wd{position:absolute;inset:0;display:grid;grid-template-columns:256px minmax(0,1fr)}
.side{margin:12px 0 12px 12px;display:flex;flex-direction:column;gap:4px;padding:14px;min-height:0}
.side .wmrow{padding:6px 8px 14px}
.switcher{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--glass-2);cursor:pointer;text-align:left;margin-bottom:10px}
.switcher .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.switcher b{font:600 13px var(--f-mono)}
.switcher span{font-size:11.5px;color:var(--muted)}
.navi{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:12px;border:0;background:none;font:500 14px var(--f-ui);cursor:pointer;text-align:left;color:var(--text)}
.navi:hover{background:var(--sunk)}
.navi[aria-current="page"]{background:var(--accent-wash);color:var(--accent);font-weight:600}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.side .conn .s{display:none}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.main-body{flex:1;overflow:auto;padding:26px 30px 30px;display:flex;flex-direction:column}

/* ───── desktop mode ───── */
.dk{position:absolute;inset:0}
.dk-top{position:absolute;left:0;right:0;top:0;height:42px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 12px 0 16px;background:var(--glass-2);border-bottom:1px solid var(--line);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);z-index:900}
.dk-top .l,.dk-top .r{display:flex;align-items:center;gap:10px}
.mini{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--glass);font:500 12px var(--f-ui);cursor:pointer;color:var(--text)}
.mini.mono{font-family:var(--f-mono)}
.win{position:absolute;display:flex;flex-direction:column;border-radius:16px;overflow:hidden;background:var(--glass-2);border:1px solid var(--glass-b);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:var(--shadow-win)}
.win.blur-off{opacity:.97}
.win-title{flex:none;height:42px;display:flex;align-items:center;gap:8px;padding:0 6px 0 14px;border-bottom:1px solid var(--line);cursor:grab;user-select:none;touch-action:none}
.win-title:active{cursor:grabbing}
.win-title b{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.win-title .wb{display:flex;gap:2px;margin-left:auto}
.win-title .wb .ibtn{width:30px;height:30px}
.win-body{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;min-height:0}
.win.front .win-title{background:var(--sunk)}
.dock{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;align-items:center;padding:8px 10px;border-radius:22px;background:var(--glass-2);border:1px solid var(--glass-b);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:var(--shadow);z-index:900}
.dock .sep{width:1px;height:28px;background:var(--line-2);margin:0 2px}
.dbtn{width:46px;height:46px;border-radius:14px;border:0;background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.dbtn:hover{background:var(--sunk)}
.dbtn.launch{background:var(--accent);color:var(--on-accent)}
.dbtn .dot{position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.dbtn .tip{position:absolute;bottom:56px;left:50%;transform:translateX(-50%);padding:4px 8px;border-radius:7px;background:var(--text);color:var(--bg);font-size:11.5px;font-weight:500;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
.dbtn:hover .tip,.dbtn:focus-visible .tip{opacity:1}
.launcher{position:absolute;inset:42px 0 0 0;z-index:950;display:flex;align-items:flex-start;justify-content:center;padding-top:70px;background:var(--scrim);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.lpanel{width:min(560px,calc(100% - 48px));padding:20px;display:flex;flex-direction:column;gap:18px;background:var(--glass-2)}
.lgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.lapp{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 4px;border-radius:14px;border:0;background:none;cursor:pointer;font:500 12.5px var(--f-ui);color:var(--text)}
.lapp:hover{background:var(--sunk)}
.lapp .tile{width:54px;height:54px;border-radius:16px}


/* ───── desktop customisation ───── */
.dk.wp-aurora{background:radial-gradient(55% 60% at 100% 0%, rgba(192,75,219,.55), transparent 70%),radial-gradient(60% 60% at 0% 100%, rgba(30,200,255,.42), transparent 70%),#05060D}
.dk.wp-mist{background:radial-gradient(70% 70% at 20% 10%, #E9E4FF, transparent 70%),radial-gradient(70% 70% at 90% 90%, #DDEFF0, transparent 70%),#EEF0F5}
.dk.wp-graphite{background:radial-gradient(80% 80% at 50% 0%, #2A2D3E, transparent 70%),#121420}
.dk.wp-sunrise{background:radial-gradient(60% 60% at 0% 100%, #FF9E7A, transparent 70%),radial-gradient(60% 60% at 100% 0%, #8C7BFF, transparent 70%),#2A1F3D}
.dock.left,.dock.right{left:auto;right:auto;bottom:auto;top:50%;transform:translateY(-50%);flex-direction:column;padding:10px 8px}
.dock.left{left:14px}
.dock.right{right:14px}
.dock.left .sep,.dock.right .sep{width:28px;height:1px;margin:2px 0}
.dock.left .dbtn .tip{bottom:auto;left:60px;top:50%;transform:translateY(-50%)}
.dock.right .dbtn .tip{bottom:auto;right:60px;left:auto;top:50%;transform:translateY(-50%)}
.dock.left .dbtn .dot{bottom:auto;left:2px;top:50%;margin:-2px 0 0}
.dock.right .dbtn .dot{bottom:auto;left:auto;right:2px;top:50%;margin:-2px 0 0}
.dock.s-small .dbtn{width:38px;height:38px}
.dock.s-large .dbtn{width:58px;height:58px}
.dock.s-large .dbtn svg{width:28px;height:28px}
.dk.autohide .dock{opacity:0;transition:opacity .2s;pointer-events:none}
.dk.autohide .dockzone:hover ~ .dock,.dk.autohide .dock:hover,.dk.autohide .dock:focus-within{opacity:1;pointer-events:auto}
.dockzone{position:absolute;z-index:899}
.dockzone.bottom{left:0;right:0;bottom:0;height:24px}
.dockzone.left{left:0;top:42px;bottom:0;width:24px}
.dockzone.right{right:0;top:42px;bottom:0;width:24px}
.ctx{position:absolute;z-index:1200;min-width:220px;padding:6px;border-radius:14px;background:var(--glass-2);border:1px solid var(--glass-b);box-shadow:var(--shadow-win);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.ctx button{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 10px;border:0;border-radius:9px;background:none;font:500 13px var(--f-ui);color:var(--text);cursor:pointer;text-align:left}
.ctx button:hover{background:var(--sunk)}
.ctx hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.widget{position:absolute;top:58px;width:300px;z-index:5;padding:16px;display:flex;flex-direction:column;gap:10px}
.widget.r{right:18px}
.widget .mini3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.widget .mini3 div{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:12px;background:var(--sunk)}
.widget .mini3 span{font-size:11px;color:var(--muted)}
.widget .mini3 b{font:500 16px var(--f-mono)}
.snapghost{position:absolute;z-index:3;border-radius:16px;border:2px dashed var(--accent);background:var(--accent-wash);opacity:.6;pointer-events:none}
.swatches{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.swatch{aspect-ratio:16/10;border-radius:12px;border:2px solid var(--line);cursor:pointer;position:relative;padding:0}
.swatch[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
.swatch span{position:absolute;left:6px;bottom:4px;font:600 10.5px var(--f-ui);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.pinrow{display:flex;align-items:center;gap:10px;padding:8px 4px;border-top:1px solid var(--line)}
.pinrow:first-child{border-top:0}
.pinrow .grow{flex:1;font-weight:500}

/* ───── overlays ───── */
.layer{position:absolute;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:var(--scrim);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .2s ease}
.dialog{width:min(520px,calc(100% - 32px));max-height:calc(100% - 48px);overflow:auto;box-sizing:border-box;background:var(--glass-2);border:1px solid var(--glass-b);border-radius:24px;padding:22px;box-shadow:var(--shadow-win);display:flex;flex-direction:column;gap:16px;backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}
.layer.sheet{align-items:flex-end}
.layer.still,.layer.still .dialog{animation:none!important}
.layer.sheet .dialog{width:100%;border-radius:28px 28px 0 0;max-height:90%;padding-bottom:36px;animation:up .28s cubic-bezier(.2,.8,.2,1)}
.dlg-h{display:flex;align-items:flex-start;gap:12px}
.dlg-h .grow{flex:1;display:flex;flex-direction:column;gap:4px}
.opt{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:18px;border:1px solid var(--line-2);background:var(--glass-2);text-align:left;cursor:pointer;color:var(--text);font:inherit;width:100%;box-sizing:border-box}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-wash)}
.opt .grow{flex:1;display:flex;flex-direction:column;gap:3px}
.opt .grow b{font-size:15px;font-weight:600}
.opt .grow span{font-size:13px;color:var(--muted);line-height:1.45}
.opt .oi{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--accent-wash);color:var(--accent);flex:none}
.cat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cat .opt{flex-direction:column;gap:10px;padding:14px}
.steps{display:flex;flex-direction:column}
.step{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.step:first-child{border-top:0}
.step .grow{flex:1;min-width:0}
.step.todo{color:var(--muted)}
.progress{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:6px;transition:width .5s}
.toast{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);z-index:1100;display:flex;align-items:center;gap:8px;max-width:calc(100% - 40px);padding:12px 16px;border-radius:14px;background:var(--text);color:var(--bg);font-size:13px;font-weight:500;box-shadow:var(--shadow);animation:up .25s ease}
@keyframes fade{from{opacity:0}}
@keyframes up{from{opacity:0;transform:translate(var(--tx,0),16px)}}
.toast{--tx:-50%}

/* ───── wizard ───── */
.wz{position:absolute;inset:0;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:56px 18px 28px}
.wz-top{width:min(560px,100%);display:flex;align-items:center;justify-content:space-between;margin-bottom:auto;padding-bottom:24px}
.wz-card{width:min(560px,100%);box-sizing:border-box;padding:26px;display:flex;flex-direction:column;gap:18px;margin-bottom:auto}
.wz-card .h1{font-size:28px}
.wz-foot{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.provider{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--glass-2)}
.provider .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.provider a{font-size:13px;font-weight:600;color:var(--accent);text-decoration:none;white-space:nowrap}

/* ───── boot ───── */
.boot{position:absolute;inset:0;z-index:2000;background:var(--boot-bg);display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden;transition:opacity .45s ease}
.boot.out{opacity:0}
.boot .stage-c{position:relative;width:100%;height:220px;display:flex;align-items:center;justify-content:center}
.orb{position:absolute;left:50%;top:50%;width:220px;height:220px;margin:-110px 0 0 -110px;border-radius:50%;filter:blur(46px);opacity:0}
.orb.o1{background:var(--orb1)}
.orb.o2{background:var(--orb2)}
.orb.o3{background:var(--orb3);width:160px;height:160px;margin:-80px 0 0 -80px}
.beam{position:absolute;left:50%;top:50%;width:0;height:2px;margin-top:-1px;border-radius:2px;transform:translateX(-50%);opacity:0;background:linear-gradient(90deg,transparent,var(--orb2) 30%,#fff 50%,var(--orb1) 70%,transparent);box-shadow:0 0 18px var(--orb2),0 0 40px var(--orb1)}
.boot .wm{font-size:44px;position:relative}
.boot .wm-clip{position:relative;clip-path:inset(0 50% 0 50%)}
.boot .tag{margin:6px 0 0;font-size:14px;color:var(--muted);opacity:0;letter-spacing:.01em}
.boot-first .o1{animation:o1 7.95s cubic-bezier(.45,0,.2,1) forwards}
.boot-first .o2{animation:o2 7.95s cubic-bezier(.45,0,.2,1) forwards}
.boot-first .o3{animation:o3 7.95s cubic-bezier(.45,0,.2,1) forwards}
.boot-first .beam{animation:beam 7.95s cubic-bezier(.5,0,.2,1) forwards}
.boot-first .wm-clip{animation:reveal 7.95s cubic-bezier(.3,0,.1,1) forwards}
.boot-first .wm{animation:track 7.95s cubic-bezier(.2,0,0,1) forwards}
.boot-first .tag{animation:tag 7.95s ease forwards}
@keyframes o1{0%{opacity:0;transform:translate(-190px,-80px) scale(.5)}18%{opacity:.85}45%{opacity:.9;transform:translate(-30px,-6px) scale(1.05)}58%{opacity:.8;transform:translate(0,0) scale(1.6,.12)}72%{opacity:0;transform:translate(0,0) scale(2.4,.05)}100%{opacity:0}}

const dwrap = document.getElementById('dwrap');
const stage = document.getElementById('stage');
let SCALE = 1;
const T = {};   // timers
const later = (k, ms, fn) => { clearTimeout(T[k]); T[k] = setTimeout(fn, ms); };

/* ───────────── small builders ───────────── */
const isWideShell = () => S.device !== 'phone';
const inDesk = () => S.shell === 'desktop' && S.device !== 'phone';
const greet = () => { const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'; };
function statusChip(st){
  if (st === 'running') return `<span class="chip ok">${ic('check',14)}Running</span>`;
  if (st === 'stopped') return `<span class="chip off">${ic('stop',14)}Stopped</span>`;
  if (st === 'starting') return `<span class="chip info">${ic('spinner',14,'spin')}Starting…</span>`;
  if (st === 'stopping') return `<span class="chip info">${ic('spinner',14,'spin')}Stopping…</span>`;
  if (st === 'restarting') return `<span class="chip info">${ic('spinner',14,'spin')}Restarting…</span>`;
  return '';
}
const accessChip = a => a === 'public'
  ? `<span class="chip info">${ic('globe',14)}Public</span>`
  : `<span class="chip acc">${ic('lock',14)}Private</span>`;
const sw = (on, act, label, extra = '') => `<button type="button" class="switch" role="switch" aria-checked="${on}" aria-label="${esc(label)}" data-act="${act}" ${extra}></button>`;
const dlgHead = (title, sub = '') => `<div class="dlg-h"><div class="grow"><h2 class="h2" style="font-size:19px">${title}</h2>${sub ? `<p class="p">${sub}</p>` : ''}</div><button type="button" class="ibtn" data-act="close" aria-label="Close">${ic('x',18)}</button></div>`;

function connHTML(compact){
  const M = {
    starting:['busy','spinner','Starting…','',1,true],
    reaching:['busy','spinner','Reaching your server…','',2,true],
    connected:['ok','shield','Connected','private tunnel · 38 ms',3,false],
    reconnecting:['warn','warn','Connection lost. Reconnecting…','',2,false]
  }[S.conn];
  const [k, i, t, s, n, spin] = M;
  const stages = compact ? '' : `<span class="stages" aria-hidden="true"><i class="on"></i><i class="${n>=2?'on':''}"></i><i class="${n>=3?'on':''}"></i></span>`;
  return `<div class="conn ${k} ${compact?'compact':''}" data-conn="${compact?1:0}" role="status" aria-live="polite">${ic(i, compact?14:16, spin?'spin':'')}<span>${t}</span>${s && !compact ? `<span class="s">· ${s}</span>` : ''}${stages}</div>`;
}

/* ───────────── screens ───────────── */
function health(){
  if (S.conn === 'reconnecting') return ['We can’t reach your server right now.', 'Your apps are most likely still running. Archangel keeps trying and will reconnect by itself.'];
  const run = S.apps.filter(a => a.status === 'running').length, n = S.attention.length;
  const words = ['No','One','Two','Three'];
  const tail = n === 0 ? 'Nothing needs you right now.' : n === 1 ? 'One small thing could use a look.' : `${words[n] || n} small things could use a look.`;
  return [n === 0 ? 'Your server is healthy and guarded.' : 'Your server is healthy and guarded.', `${run} apps are running. ${tail}`];
}
function metric(k, icon, v, pct, note, warn, live){
  return `<section class="card metric"><span class="k">${ic(icon,15)}${k}</span><span class="v" ${live?`data-live="${live}"`:''}>${v}</span>${pct==null?'<div class="bar" style="opacity:0"></div>':`<div class="bar ${warn?'warn':''}"><i ${live?`data-livebar="${live}"`:''} style="width:${pct}%"></i></div>`}<span class="note ${warn?'warn':''}">${warn?ic('warn',12):''}${note}</span></section>`;
}
function vHome(){
  const [h, sub] = health();
  const n = S.attention.length;
  const att = n ? `<div class="list">${S.attention.map(a => `
      <div class="li"><span class="tile ${a.kind==='warn'?'t4':'t2'}">${ic(a.kind==='warn'?'warn':'info',18)}</span>
      <div class="grow"><span class="t" style="white-space:normal">${a.title}</span><span class="s">${a.sub}</span></div>
      <button type="button" class="btn sm" data-act="fix" data-id="${a.id}" ${a.busy?'disabled':''}>${a.busy?ic('spinner',14,'spin')+'Working…':a.action}</button></div>`).join('')}</div>`
    : `<div class="empty">${ic('check',18)}All clear. Nothing needs you.</div>`;
  const cpu = LIVE.cpu[LIVE.cpu.length-1];
  return `<div class="scr">
    <section class="hero glass"><span class="eyebrow">${greet()}, Ray · <span class="mono">${SERVERS[S.server].name}</span></span><h1 class="h1">${h}</h1><p class="p">${sub}</p></section>
    <div class="metrics">
      ${metric('CPU','activity',FMT.cpu(cpu),cpu.toFixed(0),'Calm',false,'cpu')}
      ${metric('Memory','apps','3.1<small> / 8 GB</small>',39,'Plenty free')}
      ${metric('Disk','backup',`${S.disk}<small> / 100 GB</small>`,S.disk,S.disk>80?'Getting full':'Room to spare',S.disk>80)}
      ${metric('Uptime','clock','14d 6h',null,'Since Tue 6 Oct')}
    </div>
    <div class="home-cols">
      <section class="card"><div class="card-h"><h2 class="h2">Needs attention</h2><span class="chip ${n?'warn':'ok'}">${ic(n?'warn':'check',14)}${n?n+' to review':'All clear'}</span></div>${att}</section>
      <section class="card"><div class="card-h"><h2 class="h2">Quick actions</h2></div><div class="qa">
        <button type="button" data-act="runapp">${ic('play',18)}Run an app</button>
        <button type="button" data-act="go" data-to="terminal">${ic('terminal',18)}Open terminal</button>
        <button type="button" data-act="upload">${ic('upload',18)}Upload files</button>
        <button type="button" data-act="adddevice">${ic('qr',18)}Add a device</button>
        <button type="button" data-act="backup">${ic('backup',18)}Back up now</button>
        <button type="button" data-act="restart">${ic('restart',18)}Restart server</button>
      </div></section>
    </div></div>`;
}

function vApps(){
  const f = S.appFilter, all = S.apps.length;
  const run = S.apps.filter(a => a.status === 'running').length;
  const list = S.apps.filter(a => f === 'all' || (f === 'running' ? a.status === 'running' : a.status !== 'running'));
  const rows = list.map(a => `
    <div class="app-row"><span class="tile ${a.tile}">${a.name[0]}</span>
      <div class="nm"><b>${a.name}</b><span>${a.desc}</span></div>
      <div class="meta">${statusChip(a.status)}${accessChip(a.access)}<span class="chip off mono">port ${a.port}</span></div>
      <div class="acts">${a.status === 'running'
        ? `<button type="button" class="btn sm" data-act="openapp" data-id="${a.id}">Open</button><button type="button" class="btn sm ghost" data-act="toggleapp" data-id="${a.id}">${ic('stop',14)}Stop</button>`
        : a.status === 'stopped' ? `<button type="button" class="btn sm" data-act="toggleapp" data-id="${a.id}">${ic('play',14)}Start</button>` : ''}
        <button type="button" class="btn sm ghost" data-act="logs" data-id="${a.id}">Logs</button></div>
    </div>`).join('') || `<div class="empty muted">${ic('info',18)}No apps here.</div>`;
  return `<div class="scr">
    <div class="scr-head"><div><h1 class="h1">Apps</h1><p class="p">Each app runs in its own sealed container on your server.</p></div>
      <button type="button" class="btn primary" data-act="runapp">${ic('plus',16)}Run an app</button></div>
    <div class="seg" role="group" aria-label="Filter apps">
      <button type="button" data-act="filter" data-v="all" aria-pressed="${f==='all'}">All · ${all}</button>
      <button type="button" data-act="filter" data-v="running" aria-pressed="${f==='running'}">Running · ${run}</button>
      <button type="button" data-act="filter" data-v="stopped" aria-pressed="${f==='stopped'}">Stopped · ${all-run}</button></div>
    <section class="card">${rows}</section>
    <p class="small muted" style="margin:0;display:flex;gap:8px;align-items:flex-start">${ic('lock',14)}<span>Private apps open only on your own devices, through the tunnel. Public apps get a web address with HTTPS.</span></p>
  </div>`;
}

const cwd = () => S.path.reduce((d, n) => d.children.find(c => c.name === n), FS);
const ficon = t => ({dir:'files', image:'image', video:'film', text:'file', file:'file'}[t]);
function previewHTML(f){
  const body = f.type === 'image' ? `<div class="pv-img">${ic('image',28)}<span>${f.name}</span></div>`
    : f.type === 'video' ? `<div class="pv-img">${ic('play',28)}<span>Plays from your server</span></div>`
    : f.type === 'text' ? `<pre class="pv-text">${esc(f.content)}</pre>`
    : `<div class="pv-img">${ic('file',28)}<span>No preview for this file type</span></div>`;
  return `${body}<div style="display:flex;flex-direction:column;gap:4px"><b style="font-size:15px;word-break:break-all">${f.name}</b><span class="mono small muted">${f.size} · ${f.date}${f.dim?' · '+f.dim:''}</span></div>
    <div class="row"><button type="button" class="btn primary sm" data-act="download">${ic('download',15)}Download</button><button type="button" class="btn sm" data-act="share">${ic('link',15)}Copy private link</button></div>`;
}
function vFiles(ctx){
  const d = cwd();
  const crumbs = [`<button type="button" data-act="crumb" data-i="0">data</button>`].concat(S.path.map((p, i) => `${ic('chevR',14)}<button type="button" data-act="crumb" data-i="${i+1}">${p}</button>`)).join('');
  const rows = d.children.map(c => `<button type="button" class="li click ${S.preview && S.preview.name===c.name ? 'sel':''}" data-act="open" data-name="${esc(c.name)}" data-wide="${ctx.wide?1:0}">
      <span class="tile ${c.type==='dir'?'':'t5'}" style="width:34px;height:34px">${ic(ficon(c.type),18)}</span>
      <span class="grow"><span class="t">${c.name}</span><span class="s">${c.type==='dir'?'Folder':c.date}</span></span>
      <span class="mono small muted">${c.type==='dir'?c.meta:c.size}</span></button>`).join('');
  const pv = ctx.wide && S.preview ? `<aside class="card preview" aria-label="Preview">${previewHTML(S.preview)}</aside>` : '';
  return `<div class="scr">
    <div class="scr-head"><div><h1 class="h1">Files</h1><p class="p">Everything here lives on your server, not on someone else’s cloud.</p></div>
      <button type="button" class="btn primary" data-act="upload">${ic('upload',16)}Upload</button></div>
    <nav class="crumbs" aria-label="Folder path">${crumbs}</nav>
    <div class="files ${pv?'has-preview':''}"><section class="card list">${rows}</section>${pv}</div>
    <p class="small muted" style="margin:0">78 GB used of 100 GB · ${S.disk}% full</p>
  </div>`;
}

const SNIPPETS = [
  {n:'What’s running', c:'docker ps'},
  {n:'How full is the disk', c:'df -h'},
  {n:'Memory in use', c:'free -h'},
  {n:'Follow Archangel’s log', c:'journalctl -u archangeld -f'},
  {n:'Update the server', c:'sudo apt update && sudo apt upgrade'},
  {n:'Start Claude Code', c:'claude'},
  {n:'Busy programs', c:'htop'}
];
function vTerm(ctx){
  const t = S.term.tabs.find(x => x.id === S.term.active) || S.term.tabs[0];
  const narrow = ctx.phone || !ctx.wide;
  const srv = SERVERS[S.server].name;
  const tabs = S.term.tabs.map(x => `<div class="ctab" role="tab" aria-selected="${x.id===t.id}">
      <button type="button" class="ctab-main" data-act="ttab" data-id="${x.id}"><span class="live" aria-hidden="true"></span>${x.name}</button>
      ${narrow && x.id !== t.id ? '' : `<button type="button" class="x" data-act="tclose" data-id="${x.id}" aria-label="End session ${x.name}">${ic('x',12)}</button>`}</div>`).join('');
  const admin = S.admin
    ? `<span class="con-chip on" title="Administrator commands (sudo) are allowed">${ic('key',13)}${narrow?'Admin':'Admin on'}</span>`
    : `<span class="con-chip off" title="Administrator commands are blocked">${ic('lock',13)}${narrow?'Safe':'Admin off'}</span>`;
  const keys = ['Esc','Tab','Ctrl','Alt','↑','↓','←','→','|','/','~','-'];
  const keybar = ctx.phone ? `<div class="ckeys" aria-label="Extra keys">
      <button type="button" class="ckey alt" data-act="snips">${ic('code',15)}</button>
      ${keys.map(k => `<button type="button" class="ckey" data-act="key" data-k="${k}" ${k==='Ctrl'?`aria-pressed="${S.term.ctrl}"`:''}>${k}</button>`).join('')}</div>` : '';
  const panel = !narrow && S.term.panel ? `<aside class="snips" aria-label="Snippets"><h3>Snippets</h3><p>Tap one to put it on the command line. It runs only when you press Enter.</p>
      <div class="list">${SNIPPETS.map((x, i) => `<button type="button" class="snip" data-act="snip" data-i="${i}"><b>${x.n}</b><code>${esc(x.c)}</code></button>`).join('')}</div></aside>` : '';
  return `<div class="scr" style="flex:1;min-height:0">
  <section class="con" style="--tfs:${S.term.font}px" aria-label="Terminal">
    <div class="con-bar">
      <div class="con-tabs" role="tablist" aria-label="Sessions">${tabs}</div>
      <button type="button" class="cbtn" data-act="newtab" aria-label="New session" title="New session">${ic('plus',16)}</button>
      <span class="con-sep"></span>
      ${narrow ? '' : `<span class="con-srv">ray@${srv}</span>`}
      ${admin}
      ${narrow ? '' : `<button type="button" class="cbtn" data-act="tfont" data-v="-1" aria-label="Smaller text" title="Smaller text">A−</button><button type="button" class="cbtn" data-act="tfont" data-v="1" aria-label="Bigger text" title="Bigger text">A+</button>`}
      <button type="button" class="cbtn" data-act="snips" aria-pressed="${!narrow && S.term.panel}" aria-label="Snippets" title="Snippets">${ic('code',16)}</button>
      <button type="button" class="cbtn" data-act="tcopy" aria-label="Copy everything" title="Copy everything">${ic('copy',16)}</button>
    </div>
    <div class="con-main"><div class="con-col">
      <div class="con-out" data-term-out>${t.lines.join('\n')}</div>
      <label class="con-in">${promptHTML()}<input class="termin" type="text" aria-label="Type a command" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type a command" value="${esc(S.term.draft)}">${narrow ? '' : '<kbd>↵ run</kbd>'}</label>
    </div>${panel}</div>
    ${keybar}
    <div class="con-foot"><span class="ok">${ic('shield',12)}Connected</span><span>session “${t.name}”</span>${narrow ? '' : '<span>· running 2d 4h</span><span class="sp"></span><span>Keeps running on your server when you close the app</span>'}</div>
  </section></div>`;
}

function chartPaths(k){
  const a = LIVE[k], n = a.length, max = LMAX[k];
  const pts = a.map((v, i) => `${(i*(300/(n-1))).toFixed(1)},${(80 - (v/max)*72 - 3).toFixed(1)}`);
  const line = 'M' + pts.join('L');
  return {line, area: line + 'L300,80L0,80Z'};
}
function chart(k, label){
  const v = LIVE[k][LIVE[k].length-1];
  return `<section class="card chart"><div class="top"><span class="h3">${label}</span><span class="v" data-live="${k}">${FMT[k](v)}</span></div>
    <svg viewBox="0 0 300 80" preserveAspectRatio="none" role="img" aria-label="${label} over the last minute">
      <line x1="0" y1="21" x2="300" y2="21" style="stroke:var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <line x1="0" y1="50" x2="300" y2="50" style="stroke:var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <path data-area="${k}" d="" style="fill:var(--accent);fill-opacity:.14"/>
      <path data-line="${k}" d="" style="fill:none;stroke:var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    </svg><div class="axis"><span>60 s ago</span><span>scale 0–${LMAX[k]}${k==='cpu'?'%':k==='mem'?' GB':' MB/s'}</span><span>now</span></div></section>`;
}
function vActivity(){
  const ps = [...S.procs].sort((a, b) => b[S.procSort] - a[S.procSort]);
  return `<div class="scr">
    <div class="scr-head"><div><h1 class="h1">Activity</h1><p class="p">Live from <span class="mono">${SERVERS[S.server].name}</span>. Updates every second.</p></div><span class="chip ok">${ic('activity',14)}Live</span></div>
    <div class="charts">${chart('cpu','CPU')}${chart('mem','Memory')}${chart('disk','Disk activity')}${chart('net','Network')}</div>
    <section class="card"><div class="card-h"><h2 class="h2">Running programs</h2><span class="small muted">${ps.length} shown</span></div>
      <div class="tblwrap"><table class="tbl"><thead><tr><th>Program</th><th>What it is</th>
        <th class="num"><button type="button" data-act="sort" data-k="cpu" aria-label="Sort by CPU">CPU${S.procSort==='cpu'?' ↓':''}</button></th>
        <th class="num"><button type="button" data-act="sort" data-k="mem" aria-label="Sort by memory">Memory${S.procSort==='mem'?' ↓':''}</button></th><th></th></tr></thead>
      <tbody>${ps.map(p => `<tr><td class="mono">${p.n}</td><td class="muted">${p.d}</td><td class="num">${p.cpu.toFixed(1)}%</td><td class="num">${p.mem} MB</td>
        <td style="text-align:right">${p.keep?`<span class="chip off">${ic('lock',12)}Needed</span>`:`<button type="button" class="btn sm ghost" data-act="stopproc" data-n="${p.n}">Stop</button>`}</td></tr>`).join('')}</tbody></table></div></section>
  </div>`;
}

function vServices(){
  const tab = S.servicesTab;
  const T = [['bg','Background services'],['tasks','Scheduled tasks'],['sites','Web addresses'],['scripts','Scripts']];
  let body = '', add = '';
  if (tab === 'bg'){
    body = S.services.map((s, i) => `<div class="li"><span class="tile t5">${ic('services',18)}</span><div class="grow"><span class="t">${s.n} <span class="mono small muted">${s.id}</span></span><span class="s">${s.d}</span></div>
      ${statusChip(s.st)}${s.st==='running'?`<button type="button" class="btn sm ghost" data-act="svrestart" data-i="${i}">${ic('restart',14)}Restart</button>`:s.st==='stopped'?`<button type="button" class="btn sm" data-act="svrestart" data-i="${i}">${ic('play',14)}Start</button>`:''}</div>`).join('');
  } else if (tab === 'tasks'){
    add = 'Add a task';
    body = S.tasks.map((t, i) => `<div class="li"><span class="tile t2">${ic('clock',18)}</span><div class="grow"><span class="t">${t.n}</span><span class="s">${t.when} · next: ${t.on?t.next:'paused'}</span></div>
      <span class="chip ${t.on?'ok':'off'}">${ic(t.on?'check':'stop',13)}${t.on?'On':'Paused'}</span>${sw(t.on,'task','Turn '+t.n+' on or off',`data-i="${i}"`)}</div>`).join('');
  } else if (tab === 'sites'){
    add = 'Add a web address';
    body = S.sites.map(s => `<div class="li"><span class="tile ${s.access==='public'?'t2':''}">${ic(s.access==='public'?'globe':'lock',18)}</span><div class="grow"><span class="t mono">${s.host}</span><span class="s">Opens ${s.to}</span></div>
      ${s.access==='public'?`<span class="chip ok">${ic('lock',13)}HTTPS on</span>`:`<span class="chip acc">${ic('lock',13)}Tunnel only</span>`}<button type="button" class="ibtn" data-act="copy" data-v="${s.host}" aria-label="Copy ${s.host}">${ic('copy',16)}</button></div>`).join('');
  } else {
    add = 'New script';
    body = S.scripts.map((s, i) => `<div class="li"><span class="tile t4">${ic('code',18)}</span><div class="grow"><span class="t mono">${s.n}</span><span class="s">${s.d} · ${s.last}</span></div>
      <button type="button" class="btn sm" data-act="script" data-i="${i}" ${s.busy?'disabled':''}>${s.busy?ic('spinner',14,'spin')+'Running…':ic('play',14)+'Run'}</button></div>`).join('');
  }
  return `<div class="scr">
    <div class="scr-head"><div><h1 class="h1">Services</h1><p class="p">The quiet helpers that keep your cloud running.</p></div>${add?`<button type="button" class="btn" data-act="soon" data-v="${add}">${ic('plus',16)}${add}</button>`:''}</div>
    <div class="seg" role="group" aria-label="Service types">${T.map(([id, l]) => `<button type="button" data-act="svtab" data-v="${id}" aria-pressed="${tab===id}">${l}</button>`).join('')}</div>
    <section class="card list">${body}</section></div>`;
}

const SEC = [['servers','Servers','server'],['devices','Devices','phone'],['admin','Admin mode','key'],['security','Security','shieldPlain'],['appearance','Appearance','sun'],['updates','Updates','download'],['danger','Danger zone','warn']];
const row = (t, s, right, wrap) => `<div class="li" ${wrap?'style="flex-wrap:wrap"':''}><div class="grow" ${wrap?'style="min-width:200px"':''}><span class="t" style="white-space:normal">${t}</span><span class="s">${s}</span></div>${right}</div>`;
function secHTML(id){
  if (id === 'servers') return `<section class="card"><div class="card-h"><h2 class="h2">Servers</h2><button type="button" class="btn sm" data-act="addserver">${ic('plus',14)}Add a server</button></div>
    <div class="list">${SERVERS.map((s, i) => `<div class="li"><span class="tile">${ic('server',18)}</span><div class="grow"><span class="t mono">${s.name}</span><span class="s">${s.where} · ${s.os}</span></div>
    ${i===S.server?`<span class="chip ok">${ic('check',14)}In use</span>`:`<button type="button" class="btn sm" data-act="pickserver" data-i="${i}">Switch to it</button>`}</div>`).join('')}</div></section>`;
  if (id === 'devices') return `<section class="card"><div class="card-h"><h2 class="h2">Devices</h2><button type="button" class="btn sm primary" data-act="adddevice">${ic('qr',14)}Add a device</button></div>
    <div class="list">${S.devices.map((d, i) => `<div class="li"><span class="tile t2">${ic(d.icon,18)}</span><div class="grow"><span class="t">${d.n}</span><span class="s">${d.d}</span></div>
    ${d.me?`<span class="chip acc">${ic('check',13)}This device</span>`:`<button type="button" class="btn sm ghost" data-act="rmdevice" data-i="${i}">Remove</button>`}</div>`).join('')}</div>

    <div class="row" style="flex-wrap:nowrap"><h2 class="h2" style="flex:1">Admin mode</h2>${sw(S.admin,'admin','Admin mode')}</div>
    <span class="chip ${S.admin?'warn':'off'}" style="align-self:flex-start">${ic(S.admin?'key':'lock',14)}${S.admin?'On: administrator commands allowed':'Off: administrator commands blocked'}</span>

    if (S.phase === 'wizard') render();
  }, S.wizard.flow === 'pair' ? 900 : 850);
}

function qrGrid(){
  const N = 11, cells = [];
  const finder = (r, c) => { for (const [fr, fc] of [[0,0],[0,8],[8,0]]) { if (r>=fr && r<fr+3 && c>=fc && c<fc+3) return true; } return null; };
  let seed = 7;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++){
    const f = finder(r, c);
    seed = (seed * 9301 + 49297) % 233280;
    const inZone = (r<4 && c<4) || (r<4 && c>6) || (r>6 && c<4);
    cells.push(f ? true : inZone ? false : seed / 233280 > .5);
  }
  return `<div class="qrbox" role="img" aria-label="Pairing QR code">${cells.map(on => `<i class="${on?'on':''}"></i>`).join('')}</div>`;
}

/* ───────────── boot ───────────── */
function vBoot(){
  return `<div class="boot boot-${S.boot}" id="boot" role="img" aria-label="Archangel OS is starting">
    <div class="stage-c"><span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span><span class="beam"></span>${S.boot==='short'?'<span class="glow"></span>':''}
    <div class="wm-clip">${WM}</div></div><p class="tag">Your private cloud, guarded 24/7.</p></div>`;
}
const reduced = () => S.reduceMotion || matchMedia('(prefers-reduced-motion: reduce)').matches;
function startBoot(kind){
  // Tablets and computers always get the long animation; phones get it the
  // first time only.
  if (kind === 'short' && S.device !== 'phone') kind = 'first';
  ['wz','run','c1','c2','b1','b2'].forEach(k => { clearTimeout(T[k]); clearInterval(T[k]); });
  S.boot = kind; S.phase = 'boot'; S.modal = null; S.conn = 'starting';
  if (arguments[1] === 'later') S.firstRun = false;
  else if (kind === 'first'){ S.firstRun = true; S.wizard = freshWizard(); }
  else S.firstRun = false;
  render();
  // motion (7 s long / 2 s short) + the wordmark holds 3 s + 0.45 s fade
  const dur = reduced() ? 1100 : (kind === 'first' ? 7000 : 2000) + 3000 + 450;
  T.b1 = setTimeout(() => { const b = document.getElementById('boot'); if (b) b.classList.add('out'); }, dur - 450);
  T.b2 = setTimeout(() => { S.phase = S.firstRun ? 'wizard' : 'app'; render(); if (!S.firstRun) startConn(); }, dur + 80);
}

/* ───────────── connection ───────────── */
function setConn(v){
  const full = v === 'reconnecting' || S.conn === 'reconnecting';
  S.conn = v;
  if (full) { render(); return; }
  dev.querySelectorAll('[data-conn]').forEach(el => { el.outerHTML = connHTML(el.dataset.conn === '1'); });
}
function startConn(){
  setConn('starting');
  later('c1', 900, () => setConn('reaching'));
  later('c2', 2200, () => setConn('connected'));
}
function dropConn(){
  if (S.phase !== 'app') { toast('Finish setup first, then try this.','info'); return; }
  setConn('reconnecting');
  later('c1', 2800, () => setConn('reaching'));
  later('c2', 4200, () => setConn('connected'));
}

/* ───────────── render + fit ───────────── */
function render(){
  const d = DEV[S.device];
  dev.className = 'device ' + S.device + (S.reduceMotion ? ' rm' : '');
  dev.style.width = d.w + 'px'; dev.style.height = d.h + 'px';
  const keepScroll = [...dev.querySelectorAll('[data-scroll], .win-body')].map(e => e.scrollTop);
  let base = '';
  if (S.phase === 'wizard' || (S.phase === 'boot' && S.firstRun)) base = vWizard();
  else base = S.device === 'phone' ? shellPhone() : S.shell === 'desktop' ? shellDesk() : shellWide();
  dev.innerHTML = base + vModal() + (S.phase === 'boot' ? vBoot() : '');
  if (render.keep){ [...dev.querySelectorAll('[data-scroll], .win-body')].forEach((e, i) => { if (keepScroll[i] != null) e.scrollTop = keepScroll[i]; }); }
  render.keep = true;
  dev.querySelectorAll('[data-term-out]').forEach(el => { el.scrollTop = el.scrollHeight; });
  updateLive();
  syncBar();
  fit();
}
function fit(){
  const d = DEV[S.device], pad = S.device === 'mac' ? 6 : 26;
  const aw = stage.clientWidth - 32 - pad*2, ah = stage.clientHeight - 48 - pad*2;
  SCALE = Math.max(.2, Math.min(1, aw / d.w, ah / d.h));
  dev.style.transform = `scale(${SCALE})`;
  dwrap.style.width = d.w * SCALE + 'px'; dwrap.style.height = d.h * SCALE + 'px';
}
function syncBar(){
  document.querySelectorAll('.pbar [data-p]').forEach(b => {
    const p = b.dataset.p, v = b.dataset.v;
    if (p === 'device') b.setAttribute('aria-pressed', S.device === v);
    if (p === 'shell'){ b.setAttribute('aria-pressed', (S.device === 'phone' ? 'simple' : S.shell) === v); b.disabled = v === 'desktop' && S.device === 'phone'; b.title = b.disabled ? 'Desktop mode needs a tablet or Mac' : ''; }
    if (p === 'theme') b.setAttribute('aria-pressed', S.theme === v);
  });
}
function toast(msg, icon = 'check'){
  dev.querySelectorAll('.toast').forEach(x => x.remove());
  const t = document.createElement('div');
  t.className = 'toast'; t.setAttribute('role', 'status');
  if (inDesk()) t.style.bottom = '96px';
  t.innerHTML = ic(icon, 16) + '<span>' + esc(msg) + '</span>';
  dev.appendChild(t);
  later('toast', 2800, () => t.remove());
}

/* ───────────── live tick ───────────── */
function updateLive(){
  for (const k of Object.keys(LIVE)){
    const v = LIVE[k][LIVE[k].length-1];
    dev.querySelectorAll(`[data-live="${k}"]`).forEach(el => { el.textContent = FMT[k](v); });
    dev.querySelectorAll(`[data-livebar="${k}"]`).forEach(el => { el.style.width = (v / LMAX[k] * 100).toFixed(0) + '%'; });
    const p = chartPaths(k);
    dev.querySelectorAll(`[data-line="${k}"]`).forEach(el => el.setAttribute('d', p.line));
    dev.querySelectorAll(`[data-area="${k}"]`).forEach(el => el.setAttribute('d', p.area));
  }
}
setInterval(() => {
  const step = {cpu:[4,34,4], mem:[2.9,3.4,.05], disk:[0,40,6], net:[.1,3.2,.4]};
  for (const k of Object.keys(LIVE)){ const a = LIVE[k]; a.push(walk(a[a.length-1], ...step[k])); a.shift(); }
  updateLive();
  dev.querySelectorAll('[data-live="clock"]').forEach(el => { el.textContent = clock(); });
  if (S.modal && S.modal.type === 'device'){
    S.modal.left = Math.max(0, S.modal.left - 1);
    dev.querySelectorAll('[data-live="pair"]').forEach(el => { el.textContent = mmss(S.modal.left); });
  }
}, 1000);

/* ───────────── terminal ───────────── */
function respond(raw){
  const c = raw.trim(); if (!c) return [];
  const cmd = c.split(/\s+/)[0];
  const disk = S.disk;
  switch (cmd){
    case 'help': return ['<span class="dm">Try: ls · uptime · df -h · docker ps · whoami · sudo apt update · clear</span>'];
    case 'ls': return ['photos  films  backups  documents  compose.yml  notes.md'];
    case 'whoami': return ['ray'];
    case 'uptime': return [' 18:04:11 up 14 days,  6:22,  1 user,  load average: 0.21, 0.18, 0.15'];
    case 'df': return ['Filesystem  Size  Used  Avail  Use%  Mounted on', `/dev/sda1   100G  ${disk}G   ${100-disk}G    ${disk}%   /`];
    case 'docker': return ['NAME          STATUS'].concat(S.apps.map(a => a.id.padEnd(14) + (a.status === 'running' ? 'Up 14 days' : 'Exited')));
    case 'sudo': return S.admin
      ? ['<span class="dm">Admin mode is on, so this runs as administrator.</span>', 'Hit:1 http://archive.ubuntu.com/ubuntu noble InRelease', '<span class="ok">All packages are up to date.</span>']
      : ['<span class="wr">Admin mode is off, so administrator commands are blocked.</span>', '<span class="dm">You can turn it on in Settings, under Admin mode.</span>'];
    case 'claude': return ['<span class="dm">Starting Claude Code…</span>'];
    case 'clear': return null;
    default: return [`${esc(cmd)}: command not found. Type “help” for ideas.`];
  }
}
function runCmd(input){
  const t = S.term.tabs.find(x => x.id === S.term.active);
  const v = input.value; input.value = ''; S.term.draft = '';
  if (v.trim()) { S.term.hist.push(v); S.term.hi = S.term.hist.length; }
  const out = respond(v);
  if (out === null) t.lines = [];
  else { t.lines.push(promptHTML() + esc(v)); t.lines.push(...out); }
  dev.querySelectorAll('[data-term-out]').forEach(el => { el.innerHTML = t.lines.join('\n'); el.scrollTop = el.scrollHeight; });
}
function histStep(input, dir){
  const h = S.term.hist; if (!h.length) return;
  S.term.hi = clamp(S.term.hi + dir, 0, h.length);
  input.value = h[S.term.hi] || '';
}

/* ───────────── navigation helpers ───────────── */
function nav(to){
  if (inDesk() && NAVI[to]) { wopen(to); return; }
  S.screen = to; S.modal = null;
  if (to !== 'settings') S.phoneSet = null;
  render.keep = false; render();
}
function wopen(to){
  const D = S.desk, d = DEV[S.device];
  let w = D.wins.find(x => x.id === to);
  if (!w){ const n = D.wins.length; w = {id:to, x:80 + n*30, y:70 + n*26, w:Math.min(780, d.w-200), h:Math.min(560, d.h-180), z:++D.z}; D.wins.push(w); }
  else { w.min = false; w.z = ++D.z; }
  D.launcher = false; S.modal = null;
  render();
}
function front(id){
  const w = S.desk.wins.find(x => x.id === id); if (!w) return;
  const maxZ = Math.max(...S.desk.wins.map(x => x.z));
  if (w.z === maxZ) return;
  w.z = ++S.desk.z;
  dev.querySelectorAll('.win').forEach(el => { const ww = S.desk.wins.find(x => x.id === el.dataset.win); el.style.zIndex = ww.z; el.classList.toggle('front', ww.id === id); });
}
function setShell(v){
  if (v === 'desktop' && S.device === 'phone'){ toast('Desktop mode works on tablets, phones held sideways and Macs.','info'); return; }
  S.shell = v;
  if (v === 'desktop' && !S.desk.wins.length) S.desk.wins = defaultWins();
  S.desk.launcher = false; S.modal = null;
  render.keep = false; render();
}
function setTheme(v){
  S.theme = v;
  if (v === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', v);
  render();
}
const CONF = {
  tclose(id){
    S.term.tabs = S.term.tabs.filter(t => t.id !== id);
    if (!S.term.tabs.length) S.term.tabs.push({id:'t' + (++S.term.n), name:'main', lines:['<span class="dm">New session. It keeps running after you close the app.</span>']});
