  },
  restart(){ toast('Restarting. You’ll be reconnected in about a minute.','restart'); later('rs', 600, () => dropConn()); },
  forget(){ toast('Forgotten on this device. The server itself is unchanged.','info'); },
  remove(){ toast('Archangel was removed from ' + SERVERS[S.server].name + '. Your apps and files stay.','info'); },
  rmdevice(i){ const d = S.devices.splice(+i, 1)[0]; render(); toast(d.n + ' can no longer reach your server.'); },
  stopproc(n){ S.procs = S.procs.filter(p => p.n !== n); render(); toast(n + ' was stopped.'); }
};
const confirmBox = o => { S.modal = Object.assign({type:'confirm', typed:''}, o); render(); };

/* ───────────── actions ───────────── */
const ACT = {
  go: d => nav(d.to),
  servers: () => { S.modal = {type:'servers'}; render(); },
  pickserver: d => {
    const i = +d.i; S.modal = null;
    if (i === S.server){ render(); return; }
    S.server = i; render(); startConn(); toast('Switched to ' + SERVERS[i].name + '.','server');
  },
  shell: d => setShell(d.v),
  theme: d => setTheme(d.v),
  fix: d => {
    const a = S.attention.find(x => x.id === d.id); a.busy = true; render();
    later('fix'+d.id, 1500, () => {
      S.attention = S.attention.filter(x => x.id !== d.id);
      if (d.id === 'disk') S.disk = 73;
      render(); toast(d.id === 'disk' ? 'Freed 9 GB. Disk is now 73% full.' : 'Security updates installed.');
    });
  },
  runapp: () => { S.desk.launcher = false; S.modal = {type:'run', step:1, pick:null, name:'', access:'private', port:8000, sub:'', i:0}; render(); },
  runpick: d => { const c = CATALOG.find(x => x.id === d.id); Object.assign(S.modal, {pick:c.id, name:c.id==='custom'?'My app':c.name, port:c.port, sub:(c.id==='custom'?'app':c.id) + '.example.com', step:2}); render(); },
  runaccess: d => { S.modal.access = d.v; render(); },
  runback: () => { S.modal.step = 1; render(); },
  rungo: () => {
    const m = S.modal; m.step = 3; m.i = 0; if (!m.name.trim()) m.name = 'My app'; render();
    clearInterval(T.run);
    T.run = setInterval(() => { if (!S.modal || S.modal.type !== 'run'){ clearInterval(T.run); return; } m.i++; if (m.i >= RUN_STEPS.length) clearInterval(T.run); render(); }, 850);
  },
  rundone: d => {
    const m = S.modal, c = CATALOG.find(x => x.id === m.pick);
    S.apps.push({id:m.name.toLowerCase().replace(/[^a-z0-9]+/g,'') || 'app', name:m.name, desc:c.desc, status:'running', access:m.access, port:+m.port || c.port, addr:m.access==='public'?m.sub:m.name.toLowerCase()+'.tunnel', tile:c.tile});
    if (m.access === 'public') S.sites.push({host:m.sub, to:m.name, access:'public'});
    S.modal = null; S.appFilter = 'all';
    if (inDesk()) wopen('apps'); else { S.screen = 'apps'; render(); }
    toast(d.v === 'open' ? 'Opening ' + m.name + '…' : m.name + ' is running.');
  },
  openapp: d => { const a = S.apps.find(x => x.id === d.id); toast(a.access === 'public' ? 'Opening ' + a.addr + ' in your browser…' : 'Opening ' + a.name + ' through your private tunnel…', a.access === 'public' ? 'globe' : 'lock'); },
  toggleapp: d => {
    const a = S.apps.find(x => x.id === d.id), next = a.status === 'running' ? 'stopped' : 'running';
    a.status = next === 'running' ? 'starting' : 'stopping'; render();
    later('app'+a.id, 1300, () => { a.status = next; render(); toast(a.name + (next === 'running' ? ' is running.' : ' was stopped.')); });
  },
  logs: d => { S.modal = {type:'logs', id:d.id}; render(); },
  filter: d => { S.appFilter = d.v; render(); },
  crumb: d => { S.path = S.path.slice(0, +d.i); S.preview = null; render(); },
  open: d => {
    const e = cwd().children.find(c => c.name === d.name);
    if (e.type === 'dir'){ S.path.push(e.name); S.preview = null; render(); return; }
    S.preview = e;
    if (d.wide !== '1') S.modal = {type:'preview'};
    render();
  },
  download: () => toast('Downloading ' + (S.preview ? S.preview.name : 'file') + ' to your Downloads folder…','download'),
  share: () => toast('Private link copied. Only your devices can open it.','link'),
  upload: () => { if (!inDesk() && S.screen !== 'files') { S.screen = 'files'; render(); } else if (inDesk()) wopen('files'); toast('Pick files to upload. They go straight to your server.','upload'); },
  backup: () => toast('Backup started. It usually takes about 4 minutes.','backup'),
  restart: () => confirmBox({title:'Restart ' + SERVERS[S.server].name + '?', body:'Your apps stop for about a minute, then start again by themselves.', cta:'Restart', act:'restart'}),
  forget: () => confirmBox({title:'Forget this server?', body:'It’s removed from this device only. You can add it again with a pairing code.', cta:'Forget', danger:true, act:'forget'}),
  remove: () => confirmBox({title:'Remove Archangel from this server?', body:'This uninstalls Archangel, its tunnel and its settings. Your apps and files stay on the server.', cta:'Remove Archangel', danger:true, act:'remove', require:SERVERS[S.server].name}),
  rmdevice: d => confirmBox({title:'Remove ' + S.devices[+d.i].n + '?', body:'It will lose access to your server straight away.', cta:'Remove', danger:true, act:'rmdevice', arg:d.i}),
  stopproc: d => confirmBox({title:'Stop ' + d.n + '?', body:'This program stops right away. Its app may stop working until you start it again.', cta:'Stop it', danger:true, act:'stopproc', arg:d.n}),
  confirmok: () => { const m = S.modal; S.modal = null; render(); CONF[m.act](m.arg); },
  close: () => { S.modal = null; render(); },
  ttab: d => { S.term.active = d.id; render(); },
  tclose: d => { const x = S.term.tabs.find(t => t.id === d.id); confirmBox({title:'End “' + x.name + '”?', body:'Anything still running in this session stops. Other sessions keep going.', cta:'End session', danger:true, act:'tclose', arg:d.id}); },
  tfont: d => { S.term.font = clamp(S.term.font + (+d.v), 11, 18); render(); },
  customize: () => { S.menu = null; S.modal = {type:'custom'}; render(); },
  wall: d => { S.prefs.wall = d.v; S.menu = null; render(); },
  dockpos: d => { S.prefs.dockPos = d.v; fitWinsToDock(); render(); },
  docksize: d => { S.prefs.dockSize = d.v; render(); },
  autohide: () => { S.prefs.autohide = !S.prefs.autohide; render(); },
  widget: () => { S.prefs.widget = !S.prefs.widget; S.menu = null; render(); },
  pintoggle: d => { const P = S.prefs; const i = P.pinned.indexOf(d.to); if (i >= 0) P.pinned.splice(i, 1); else P.pinned.push(d.to); S.menu = null; render(); },
  pinmove: d => { const P = S.prefs; const i = P.pinned.indexOf(d.to), j = i + (+d.v); if (i < 0 || j < 0 || j >= P.pinned.length) return; [P.pinned[i], P.pinned[j]] = [P.pinned[j], P.pinned[i]]; render(); },
  resetdesk: () => { S.prefs = {dockPos:'bottom', dockSize:'medium', autohide:false, pinned:NAV.map(n => n.id), wall:'halo', widget:true}; render(); },
  arrange: () => { S.desk.wins = defaultWins(); S.menu = null; render(); },
  menuclose: () => { S.menu = null; render(); },
  tcopy: () => toast('Copied everything in this session.','copy'),
  snips: () => {
    const narrow = S.device === 'phone' || (!inDesk() ? false : (S.desk.wins.find(w => w.id === 'terminal') || {w:999}).w < 640);
    if (narrow) { S.modal = {type:'snips'}; render(); } else { S.term.panel = !S.term.panel; render(); }
  },
  snip: d => { S.term.draft = SNIPPETS[+d.i].c; S.modal = null; render(); const i = dev.querySelector('.termin'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } },
  newtab: () => { const n = ++S.term.n; const id = 't' + n; S.term.tabs.push({id, name:'session-' + (n-2), lines:['<span class="dm">New session. It keeps running after you close the app.</span>']}); S.term.active = id; render(); },
  key: (d, el) => {
    const input = dev.querySelector('.termin'); if (!input) return;
    const k = d.k;
    if (k === 'Ctrl'){ S.term.ctrl = !S.term.ctrl; el.setAttribute('aria-pressed', S.term.ctrl); input.focus(); return; }
    if (k === 'Esc') input.value = '';
    else if (k === '↑') histStep(input, -1);
    else if (k === '↓') histStep(input, 1);
    else if (k === 'Tab' || k === 'Alt' || k === '←' || k === '→') { /* handled by the real terminal */ }
    else input.value += k;
    S.term.draft = input.value;
    input.focus();
  },
  sort: d => { S.procSort = d.k; render(); },
  svtab: d => { S.servicesTab = d.v; render(); },
  svrestart: d => {
    const s = S.services[+d.i], was = s.st; s.st = 'restarting'; render();
    later('sv'+d.i, 1400, () => { s.st = 'running'; render(); toast(s.n + (was === 'stopped' ? ' started.' : ' restarted.')); });
  },
  task: d => { const t = S.tasks[+d.i]; t.on = !t.on; if (t.on && t.next === 'Paused') t.next = 'Sun 1 Nov, 03:00'; render(); toast(t.n + (t.on ? ' is on.' : ' is paused.'), 'clock'); },
  copy: d => { try { navigator.clipboard.writeText(d.v).catch(() => {}); } catch (e) {} toast('Copied ' + d.v,'copy'); },
  script: d => {
    const s = S.scripts[+d.i]; s.busy = true; render();
    later('sc'+d.i, 1800, () => { s.busy = false; s.last = 'Just now · finished'; render(); toast(s.n + ' finished in 41 seconds.'); });
  },
  soon: d => toast(d.v + ' opens a short form here. Not in this prototype yet.','info'),
  setsec: d => { S.settingsSec = d.id; S.phoneSet = d.id; render(); },
  setback: () => { S.phoneSet = null; render(); },
  admin: () => { S.admin = !S.admin; render(); toast(S.admin ? 'Admin mode is on.' : 'Admin mode is off. Administrator commands are blocked.', 'key'); },
  lock: () => { S.lockApp = !S.lockApp; render(); },
  motion: () => { S.reduceMotion = !S.reduceMotion; render(); },
  rotate: () => toast('New tunnel keys made for all 3 devices.','key'),
  replay: d => startBoot(d.v, d.v === 'short' ? 'later' : undefined),
  update: () => { S.upd.busy = true; render(); later('upd', 2000, () => { S.upd.busy = false; S.upd.server = S.upd.avail; render(); toast('Server program updated to ' + S.upd.avail + '.'); }); },
  adddevice: () => { S.desk.launcher = false; S.modal = {type:'device', left:600}; render(); },
  copycode: () => { try { navigator.clipboard.writeText('K7Q4-2M9X').catch(() => {}); } catch (e) {} toast('Code copied.','copy'); },
  addserver: () => { S.modal = null; S.wizard = freshWizard(true); S.phase = 'wizard'; render(); },
  scan: () => toast('On a phone, the camera opens here to scan the code.','qr'),
  wz: d => { S.wizard.step = d.to; render.keep = false; render(); },
  wzkey: () => { S.wizard.key = true; render(); },
  wzgo: () => { Object.assign(S.wizard, {flow:'setup', step:'progress', i:0}); render(); startWizardProgress(); },
  wzpair: () => { Object.assign(S.wizard, {flow:'pair', step:'progress', i:0}); render(); startWizardProgress(); },
  wzdone: () => {
    if (S.wizard.cancelable && S.wizard.flow === 'setup'){
      SERVERS.push({name:'archangel-0' + (SERVERS.length + 1), where:S.wizard.addr || '203.0.113.24', os:'Ubuntu 24.04'});
      S.server = SERVERS.length - 1;
    }
    S.phase = 'app'; S.firstRun = false; S.screen = 'home'; render.keep = false; render(); startConn();
  },
  wzcancel: () => { clearInterval(T.wz); S.phase = 'app'; render(); },
  launcher: () => { S.menu = null; S.desk.launcher = !S.desk.launcher; S.desk.q = ''; render(); if (S.desk.launcher) { const i = document.getElementById('lq'); if (i) i.focus(); } },
  lopen: d => wopen(d.to),
  wopen: d => { S.menu = null; wopen(d.to); },
  wmin: d => { S.desk.wins.find(x => x.id === d.id).min = true; render(); },
  wclose: d => { S.desk.wins = S.desk.wins.filter(x => x.id !== d.id); render(); },
  wclose2: d => { S.desk.wins = S.desk.wins.filter(x => x.id !== d.to); S.menu = null; render(); },
  wmax: d => {
    const w = S.desk.wins.find(x => x.id === d.id), D = DEV[S.device];
    if (w.max){ Object.assign(w, w.prev); w.max = false; }
    else { w.prev = {x:w.x, y:w.y, w:w.w, h:w.h}; Object.assign(w, {x:8, y:50, w:D.w - 16, h:D.h - 50 - 92, max:true}); }
    w.z = ++S.desk.z; render();
  }
};

/* ───────────── events ───────────── */
document.addEventListener('click', e => {
  const p = e.target.closest('.pbar [data-p]');
  if (p){
    const k = p.dataset.p, v = p.dataset.v;
    if (k === 'device'){ S.device = v; if (S.shell === 'desktop' && v !== 'phone') S.desk.wins = defaultWins(); S.modal = null; S.desk.launcher = false; render.keep = false; render(); }
    else if (k === 'shell') setShell(v);
    else if (k === 'theme') setTheme(v);
    else if (k === 'boot') startBoot(v, v === 'short' ? 'later' : undefined);
    else if (k === 'drop') dropConn();
    return;
  }
  if (!dev.contains(e.target)) return;
  if (S.menu && !e.target.closest('.ctx')) { S.menu = null; render(); return; }
  if (e.target.matches('[data-layer]')) { ACT.close(); return; }
  if (e.target.matches('[data-launcher]')) { S.desk.launcher = false; render(); return; }
  const a = e.target.closest('[data-act]');
  if (!a || a.disabled) return;
  const f = ACT[a.dataset.act];
  if (f) f(a.dataset, a, e);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.classList && t.classList.contains('termin')) { S.term.draft = t.value; return; }
  if (t.id === 'lq'){ S.desk.q = t.value; const g = document.getElementById('lgrid'); if (g) g.innerHTML = launcherItems(); return; }
  const b = t.dataset && t.dataset.bind; if (!b) return;
  const [root, key] = b.split('.');
  const obj = root === 'wz' ? S.wizard : S.modal; if (!obj) return;
  obj[key] = t.value;
  if (b === 'm.typed'){ const btn = dev.querySelector('[data-act="confirmok"]'); if (btn) btn.disabled = t.value !== S.modal.require; }
});
dev.addEventListener('keydown', e => {
  const t = e.target;
  if (t.classList && t.classList.contains('termin')){
    if (e.key === 'Enter'){ e.preventDefault(); runCmd(t); }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); histStep(t, -1); }
    else if (e.key === 'ArrowDown'){ e.preventDefault(); histStep(t, 1); }
  } else if (e.key === 'Escape' && (S.modal || S.desk.launcher)){ S.modal = null; S.desk.launcher = false; render(); }
});
dev.addEventListener('pointerdown', e => {
  const winEl = e.target.closest('.win');
  if (winEl) front(winEl.dataset.win);
  const h = e.target.closest('[data-drag]');
  if (!h || e.target.closest('button')) return;
  const w = S.desk.wins.find(x => x.id === h.dataset.drag); if (!w) return;
  const sx = e.clientX, sy = e.clientY, ox = w.x, oy = w.y, D = DEV[S.device];
  try { h.setPointerCapture(e.pointerId); } catch (err) {}
  const mv = ev => {
    w.x = Math.round(clamp(ox + (ev.clientX - sx) / SCALE, -w.w + 140, D.w - 100));
    w.y = Math.round(clamp(oy + (ev.clientY - sy) / SCALE, 42, D.h - 80));
    w.max = false; winEl.style.left = w.x + 'px'; winEl.style.top = w.y + 'px';
  };
  let snap = null;
  const ghost = document.createElement('div'); ghost.className = 'snapghost'; ghost.hidden = true; dev.querySelector('.dk').appendChild(ghost);
  const areaTop = 50, areaBottom = D.h - 92;
  const zoneFor = ev => {
    const r = dev.getBoundingClientRect(), px = (ev.clientX - r.left) / SCALE, py = (ev.clientY - r.top) / SCALE;
    if (px < 24) return {x:8, y:areaTop, w:D.w/2 - 12, h:areaBottom - areaTop};
    if (px > D.w - 24) return {x:D.w/2 + 4, y:areaTop, w:D.w/2 - 12, h:areaBottom - areaTop};
    if (py < 48) return {x:8, y:areaTop, w:D.w - 16, h:areaBottom - areaTop};
    return null;
  };
  const mv2 = ev => { snap = zoneFor(ev); ghost.hidden = !snap; if (snap) Object.assign(ghost.style, {left:snap.x+'px', top:snap.y+'px', width:snap.w+'px', height:snap.h+'px'}); };
  h.addEventListener('pointermove', mv2);
  const up = () => {
    h.removeEventListener('pointermove', mv); h.removeEventListener('pointermove', mv2); h.removeEventListener('pointerup', up); h.removeEventListener('pointercancel', up);
    ghost.remove();
    if (snap){ w.prev = {x:ox, y:oy, w:w.w, h:w.h}; Object.assign(w, {x:snap.x, y:snap.y, w:snap.w, h:snap.h}); render(); }
  };
  h.addEventListener('pointermove', mv); h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up);
});
dev.addEventListener('contextmenu', e => {
  if (!inDesk()) return;
  const r = dev.getBoundingClientRect();
  const x = Math.min((e.clientX - r.left) / SCALE, DEV[S.device].w - 240), y = Math.min((e.clientY - r.top) / SCALE, DEV[S.device].h - 220);
  const d = e.target.closest('[data-dock]');
  if (d){
    e.preventDefault();
    const id = d.dataset.dock, pinned = S.prefs.pinned.includes(id), isOpen = S.desk.wins.some(w => w.id === id);
    S.menu = {x, y: Math.max(48, y - 140), items:[
      {act:'wopen', to:id, icon:NAVI[id].icon, label:'Open ' + NAVI[id].label},
      ...(isOpen ? [{act:'wclose2', to:id, icon:'x', label:'Close window'}] : []),
      '-',
      {act:'pintoggle', to:id, icon:pinned?'x':'plus', label:pinned?'Remove from dock':'Keep in dock'},
      {act:'customize', icon:'settings', label:'Customize dock…'}]};
    render(); return;
  }
  if (e.target.closest('[data-desk]') && !e.target.closest('.win, .dock, .dk-top, .widget')){
    e.preventDefault();
    S.menu = {x, y, items:[
      {act:'customize', icon:'image', label:'Change wallpaper…'},
      {act:'customize', icon:'settings', label:'Customize dock…'},
      {act:'widget', icon:'activity', label:S.prefs.widget ? 'Hide health widget' : 'Show health widget'},
      '-',
      {act:'arrange', icon:'apps', label:'Tidy up windows'},
      {act:'launcher', icon:'grid', label:'All apps'}]};
    render();
  }
});
addEventListener('resize', fit);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => render());

if (S.shell === 'desktop' && S.device !== 'phone') S.desk.wins = defaultWins();
startBoot('first');
})();
</script>
