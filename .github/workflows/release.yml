name: Release Archangel

# One release pipeline, one version. The version is `version:` in
# app/frontend/pubspec.yaml (e.g. 0.8.0+2); the tag is always v<semver>
# (v0.8.0). Every release builds the server program (archangeld) AND all
# the apps (macOS, Windows, Android) and publishes them to that tag's
# GitHub Release.
#
# Cut a release:
#   1. scripts/bump_version.sh <major|minor|patch|build>, commit, push
#   2. Actions -> "Release Archangel" -> Run workflow
#
# The run creates and pushes the tag itself and builds in the same run (a
# tag pushed with the default GITHUB_TOKEN does not re-trigger this
# workflow's own `push: tags` event - a deliberate GitHub anti-loop rule -
# so `plan` resolves everything up front). Pushing a tag by hand
# (git tag v0.8.0 && git push origin v0.8.0) also works, as long as it
# matches the pubspec version at that commit.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.8"
  GO_VERSION: "1.24"

permissions:
  contents: write

jobs:
  # Reads the version from the pubspec, makes (or checks) the tag, and
  # writes version-manifest.json, which every build job uploads to the
  # release and the app reads back (see update_check_service.dart).
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      build: ${{ steps.resolve.outputs.build }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: resolve
        run: |
          set -euo pipefail

          line=$(grep -E '^version: ' app/frontend/pubspec.yaml)
          if [[ ! "$line" =~ ^version:\ ([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$ ]]; then
            echo "::error::app/frontend/pubspec.yaml needs 'version: X.Y.Z+N', found: $line" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          build="${BASH_REMATCH[2]}"
          tag="v${version}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Fail early, before anything is built.
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "::error::Tag $tag already exists on origin - run scripts/bump_version.sh and push first." >&2
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$tag" "${{ github.sha }}"
            git push origin "$tag"
          elif [ "${{ github.ref_name }}" != "$tag" ]; then
            echo "::error::Pushed tag ${{ github.ref_name }} doesn't match the pubspec version ($tag)." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # The new keys are version/build/tag. The rest are legacy keys that
      # apps released before the single version still read
      # (archangel/frontend/backend for versions, frontend_tag/backend_tag
      # for where to download), all set from the one version and tag.
      - name: Write version-manifest.json
        run: |
          set -euo pipefail
          jq -n \
            --arg version "${{ steps.resolve.outputs.version }}" \
            --argjson build "${{ steps.resolve.outputs.build }}" \
            --arg tag "${{ steps.resolve.outputs.tag }}" \
            --arg published_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version:$version, build:$build, tag:$tag,
              archangel:$version, frontend:$version, backend:$version,
              frontend_tag:$tag, backend_tag:$tag, published_at:$published_at}' \
            > version-manifest.json
          cat version-manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: version-manifest
          path: version-manifest.json
          retention-days: 1

  build-macos:
    needs: plan
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Flutter/Dart package cache, keyed off pubspec.lock so it invalidates
      # only when dependencies actually change.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            app/frontend/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('app/frontend/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      # CocoaPods cache: the project gained a Podfile this session
      # (mobile_scanner) and pod installs weren't cached anywhere before -
      # keyed on Podfile.lock so a dependency bump still invalidates it.
      - uses: actions/cache@v4
        with:
          path: app/frontend/macos/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('app/frontend/macos/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release --dart-define=APP_VERSION=${{ needs.plan.outputs.version }} --dart-define=APP_BUILD=${{ needs.plan.outputs.build }}

      # Standard drag-and-drop installer: a DMG containing the .app next
      # to a symlink to /Applications, so opening it shows the familiar
      # "drag Archangel.app onto Applications" layout instead of a zip
      # the user has to manually unpack and move.
      - name: Create drag-and-drop DMG
        working-directory: app/frontend/build/macos/Build/Products/Release
        run: |
          mkdir -p dmg-root
          cp -R Archangel.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "Archangel" -srcfolder dmg-root -ov -format UDZO Archangel-macos.dmg

      - uses: actions/download-artifact@v4
        with:
          name: version-manifest

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          files: |
            app/frontend/build/macos/Build/Products/Release/Archangel-macos.dmg
            version-manifest.json
          generate_release_notes: false

  build-windows:
    needs: plan
    # Pinned rather than windows-latest: newer runner images have shipped
    # with a Visual Studio setup that confuses CMake's generator
    # auto-detection ("could not find any instance of Visual Studio" while
    # it's actually just picked the wrong one) - windows-2022 is the known
    # good image for this.
    runs-on: windows-2022
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/Pub/Cache
            app/frontend/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('app/frontend/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      # Sets VCINSTALLDIR/VSINSTALLDIR etc. from the actual installed VS2022,
      # so Flutter's CMake invocation finds it directly instead of relying
      # on its own auto-detection (the thing that picked the wrong
      # generator above).
      - uses: ilammy/msvc-dev-cmd@v1

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=APP_VERSION=${{ needs.plan.outputs.version }} --dart-define=APP_BUILD=${{ needs.plan.outputs.build }}

      # windows-2022 ships Inno Setup 6 preinstalled - builds a proper
      # Setup.exe installer (Start Menu + optional desktop shortcut, a
      # registered uninstaller) instead of a zip the user has to unpack
      # and place themselves.
      - name: Build installer with Inno Setup
        working-directory: app/frontend/windows/installer
        shell: pwsh
        run: |
          $version = "${{ needs.plan.outputs.version }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="$version" archangel.iss

      - uses: actions/download-artifact@v4
        with:
          name: version-manifest

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          files: |
            app/frontend/windows/installer/Output/Archangel-windows-setup.exe
            version-manifest.json
          generate_release_notes: false

  build-android:
    needs: plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            app/frontend/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('app/frontend/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      # Gradle cache: wrapper distribution + downloaded deps, keyed off the
      # wrapper version and every gradle file so a dependency bump still
      # invalidates it correctly.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('app/frontend/android/**/*.gradle*', 'app/frontend/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - run: flutter pub get

      # arm64-v8a only, not a universal APK: every device this app targets
      # (anything from the last ~6 years) is arm64, and skipping armeabi-v7a
      # /x86_64 avoids compiling and packaging code nobody runs - faster
      # build, smaller APK.
      - run: flutter build apk --release --split-per-abi --target-platform android-arm64 --dart-define=APP_VERSION=${{ needs.plan.outputs.version }} --dart-define=APP_BUILD=${{ needs.plan.outputs.build }}
      # Give the download a name people recognise (Flutter's default is
      # app-arm64-v8a-release.apk).
      - name: Rename APK
        working-directory: app/frontend/build/app/outputs/flutter-apk
        run: cp app-arm64-v8a-release.apk Archangel-android.apk

      - uses: actions/download-artifact@v4
        with:
          name: version-manifest

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          files: |
            app/frontend/build/app/outputs/flutter-apk/Archangel-android.apk
            version-manifest.json
          generate_release_notes: false

  build-backend:
    needs: plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: app/backend/go.sum

      - run: go vet ./...
      - run: go test ./...
      - run: make build-linux-amd64
      - run: make build-linux-arm64

      - name: Generate SHA256SUMS
        working-directory: app/backend/bin
        run: sha256sum archangeld-amd64 archangeld-arm64 > SHA256SUMS

      - uses: actions/download-artifact@v4
        with:
          name: version-manifest

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          files: |
            app/backend/bin/archangeld-amd64
            app/backend/bin/archangeld-arm64
            app/backend/bin/SHA256SUMS
            version-manifest.json
          generate_release_notes: true
